plugins {
    id 'multiloader-loader'
    // Loom plugin id changed for 26.1: 'net.fabricmc.fabric-loom' (no remapping; MC is unobfuscated).
    // https://fabricmc.net/2026/03/14/261.html
    id 'net.fabricmc.fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No `mappings` line: 26.1 is unobfuscated and the new loom plugin does not remap.
    // modImplementation/modCompileOnly are gone; use plain implementation/compileOnly.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

def changelogContent = rootProject.file('CHANGELOG.md').exists() ? rootProject.file('CHANGELOG.md').getText('UTF-8') : ''
def changelogMatcher = ~/(?s)## \[${version}\][^\n]*\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)/
def changelogMatch = (changelogContent =~ changelogMatcher)
def changelogLatest = changelogMatch.find() ? changelogMatch.group(1).trim() : ''

publishMods {
    // remapJar no longer exists for 26.1 (nothing to remap on unobfuscated MC); publish the plain jar.
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = changelogLatest
    version = project.version.toString()
    type = STABLE
    displayName = "${mod_name} ${project.version}-${minecraft_version} (Fabric)"
    modLoaders.add("fabric")
    dryRun = providers.environmentVariable('PUBLISH_DRY_RUN').map { it == 'true' }.orElse(false)
    maxRetries = 3

    if (providers.environmentVariable('MODRINTH_API_KEY').isPresent() && project.hasProperty('modrinth_project_id') && modrinth_project_id) {
        modrinth {
            accessToken = providers.environmentVariable('MODRINTH_API_KEY')
            projectId = modrinth_project_id
            minecraftVersionRange {
                start = publish_mc_start
                end = publish_mc_end
            }
        }
    }

    if (providers.environmentVariable('CURSEFORGE_API_KEY').isPresent() && project.hasProperty('cf_project_id') && cf_project_id) {
        curseforge {
            accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
            projectId = cf_project_id
            // Server-authoritative worldgen mod: needed on the server, not required on remote clients.
            clientRequired = false
            serverRequired = true
            if (project.hasProperty('cf_project_slug') && cf_project_slug) {
                projectSlug = cf_project_slug
            }
            minecraftVersionRange {
                start = publish_mc_start
                end = publish_mc_end
            }
        }
    }
}

// Discord announcement is handled by .github/scripts/announce_release.py
// after all loaders have published. See .github/workflows/release.yml.
