plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

def changelogContent = rootProject.file('CHANGELOG.md').exists() ? rootProject.file('CHANGELOG.md').getText('UTF-8') : ''
def changelogMatcher = ~/(?s)## \[${version}\][^\n]*\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)/
def changelogMatch = (changelogContent =~ changelogMatcher)
def changelogLatest = changelogMatch.find() ? changelogMatch.group(1).trim() : ''

publishMods {
    file = tasks.named('remapJar').flatMap { it.archiveFile }
    changelog = changelogLatest
    version = project.version.toString()
    type = STABLE
    displayName = "${mod_name} ${project.version}-${minecraft_version} (Fabric)"
    modLoaders.add("fabric")
    dryRun = providers.environmentVariable('PUBLISH_DRY_RUN').map { it == 'true' }.orElse(false)
    maxRetries = 3

    if (providers.environmentVariable('MODRINTH_API_KEY').isPresent() && project.hasProperty('modrinth_project_id') && modrinth_project_id) {
        modrinth {
            accessToken = providers.environmentVariable('MODRINTH_API_KEY')
            projectId = modrinth_project_id
            minecraftVersionRange {
                start = publish_mc_start
                end = publish_mc_end
            }
        }
    }

    if (providers.environmentVariable('CURSEFORGE_API_KEY').isPresent() && project.hasProperty('cf_project_id') && cf_project_id) {
        curseforge {
            accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
            projectId = cf_project_id
            minecraftVersionRange {
                start = publish_mc_start
                end = publish_mc_end
            }
        }
    }

    if (providers.environmentVariable('GITHUB_TOKEN').isPresent()) {
        github {
            accessToken = providers.environmentVariable('GITHUB_TOKEN')
            repository = 'FinnSetchell/MoogsPaths'
            commitish = '1.20.1'
            tagName = providers.environmentVariable('GITHUB_REF_NAME').orElse("v${project.version}")
        }
    }
}
