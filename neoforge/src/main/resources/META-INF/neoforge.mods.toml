modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "${mod_homepage}"
logoFile = "assets/moogs_paths/icon.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''
# Server-side mod: pure worldgen runs on the (logical/integrated) server. A remote client does
# NOT need it to join a dedicated server running it, so skip the version-match handshake.
# (It still loads in singleplayer, since singleplayer IS the physical client.)
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
