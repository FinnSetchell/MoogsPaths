plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = [at.absolutePath]
    }
    // No parchment block: 26.1 ships with Mojang parameter names directly.
    runs {
        client {
            client()
        }
        // 26.1 / ModDevGradle: the combined `data` run type was split into clientData + serverData.
        // clientData() is the drop-in for the old data() — it has access to both client and server providers.
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

def changelogContent = rootProject.file('CHANGELOG.md').exists() ? rootProject.file('CHANGELOG.md').getText('UTF-8') : ''
def changelogMatcher = ~/(?s)## \[${version}\][^\n]*\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)/
def changelogMatch = (changelogContent =~ changelogMatcher)
def changelogLatest = changelogMatch.find() ? changelogMatch.group(1).trim() : ''

publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = changelogLatest
    version = project.version.toString()
    type = STABLE
    displayName = "${mod_name} ${project.version}-${minecraft_version} (NeoForge)"
    modLoaders.add("neoforge")
    dryRun = providers.environmentVariable('PUBLISH_DRY_RUN').map { it == 'true' }.orElse(false)
    maxRetries = 3

    if (providers.environmentVariable('MODRINTH_API_KEY').isPresent() && project.hasProperty('modrinth_project_id') && modrinth_project_id) {
        modrinth {
            accessToken = providers.environmentVariable('MODRINTH_API_KEY')
            projectId = modrinth_project_id
            minecraftVersionRange {
                start = publish_mc_start
                end = publish_mc_end
            }
        }
    }

    if (providers.environmentVariable('CURSEFORGE_API_KEY').isPresent() && project.hasProperty('cf_project_id') && cf_project_id) {
        curseforge {
            accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
            projectId = cf_project_id
            // Server-authoritative worldgen mod: needed on the server, not required on remote clients.
            clientRequired = false
            serverRequired = true
            minecraftVersionRange {
                start = publish_mc_start
                end = publish_mc_end
            }
        }
    }
}

// Discord announcement is handled by .github/scripts/announce_release.py
// after all loaders have published. See .github/workflows/release.yml.
