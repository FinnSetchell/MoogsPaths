plugins {
    // Loom plugin id changed for 26.1: 'net.fabricmc.fabric-loom' (no remapping; MC is unobfuscated).
    // See https://fabricmc.net/2026/03/14/261.html and https://docs.fabricmc.net/develop/porting/next#build-script
    id 'net.fabricmc.fabric-loom' version '1.16.2' apply(false)
    id 'net.neoforged.moddev' version '2.0.141' apply(false)
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply(false)
}

def loaderProjectsForCollect = subprojects.findAll { it.name in ['fabric', 'neoforge', 'forge'] && new File(it.projectDir, 'build.gradle').exists() }

tasks.register('collectJars', Copy) {
    loaderProjectsForCollect.each { sub ->
        dependsOn "${sub.path}:jar"
        from(sub.tasks.named('jar').flatMap { it.archiveFile })
    }
    into layout.buildDirectory.dir('libs')
}

if (tasks.findByName('build') == null) {
    tasks.register('build') {
        loaderProjectsForCollect.each { sub -> dependsOn "${sub.path}:build" }
        finalizedBy 'collectJars'
    }
} else {
    tasks.named('build').configure { finalizedBy 'collectJars' }
}
