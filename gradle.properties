# Project
mod_version=1.0.4
group=com.finndog.moogs_paths
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Moog's Paths
mod_author=finndog
mod_id=moogs_paths
archives_base_name=MoogsPaths
license=CC0-1.0
credits=FinnDog
description=Adds a generated network of paths and trails to the overworld, with biome-specific styles and roadside decorations like cairns, signposts and lamps. Fully configurable through datapacks.
minecraft_version_range=[26.1, 26.2)

# Links
mod_homepage=https://github.com/FinnSetchell/MoogsPaths
mod_issues=https://github.com/FinnSetchell/MoogsPaths/issues
mod_discord=https://discord.gg/S5nffJbuvA
mod_kofi=https://ko-fi.com/finndog
mod_curseforge=https://legacy.curseforge.com/minecraft/mc-mods/mp-moogs-paths
mod_modrinth=https://modrinth.com/project/mp-moogs-paths
mod_releases=https://github.com/FinnSetchell/MoogsPaths/releases

# Parchment is no longer required: 26.1 ships fully unobfuscated with Mojang parameter names.
# See https://neoforged.net/news/26.1release/ "Removal of obfuscation".

# Fabric
fabric_version=0.149.1+26.1.2
fabric_loader_version=0.18.4

# NeoForge
# Versions are now <mc-version>.<neoforge-build>[-beta] - see https://neoforged.net/news/26.1release/
neoforge_version=26.1.2.59-beta
neoforge_loader_version_range=[4,)
neoforge_version_range=[26.1, 26.2)

# Forge
forge_version=64.0.8
forge_loader_version_range=[64,)
forge_version_range=[64, 65)

# Fabric MC dependency uses Fabric/SemVer syntax (not Maven). Update when bumping minecraft_version_range.
fabric_mc_dependency=>=26.1 <26.2

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
