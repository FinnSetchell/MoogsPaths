# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.0
group=com.finndog.moogs_paths
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Moog's Paths
mod_author=finndog
mod_id=moogs_paths
license=CC0-1.0
credits=FinnDog
description=Adds a generated network of paths and trails to the overworld, with biome-specific surfaces and scattered decorations like cairns, signposts and shrines. Fully configurable through datapacks.
minecraft_version_range=[1.20.1, 1.21)

# Publishing
# Leave cf_project_id / modrinth_project_id empty until the projects exist on the
# respective platforms; publishMods skips a target when its id is blank or its api
# token is missing.
cf_project_id=
modrinth_project_id=
publish_mc_start=1.20.1
publish_mc_end=1.20.1
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge
forge_version=47.2.30
forge_loader_version_range=[47,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
