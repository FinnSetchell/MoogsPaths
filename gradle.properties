# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
# Parchment never published a 1.20 release, so we layer the 1.20.1 mappings on top of 1.20 Mojang names.
# Method/class names match (only parameter names + javadocs come from Parchment); a 1.20 -> 1.20.1 signature
# drift would show as a wrong param name, never a wrong method binding.
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.83.0+1.20
fabric_loader_version=0.16.9

# Forge
forge_version=46.0.14
forge_loader_version_range=[46,47)

# Discord webhook settings
discord_role_id=1466012771379581039
discord_avatar_url=https://media.forgecdn.net/avatars/thumbnails/1814/575/64/64/639147005829648185.png
discord_banner_url=https://pub-24a4e0e7ea8544a5b6f73c3a23512589.r2.dev/images/d5e8c0f59add420ea9e76f95544c256a.png
discord_embed_color=#8B6914
# Set false on a single release to skip the @role ping on the banner post.
# Reset to true automatically by .github/scripts/post_release_bump.py.
discord_ping=true

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Pin NeoFormRuntime to a version that still supports the intermediaryToNamedMapping result.
# legacyforge 2.0.77 on Forge 46.x (MC 1.20) requests that result; newer NFRT releases
# dropped it and break :common:createMinecraftArtifacts. Bump cautiously when upgrading Forge.
neoForge.neoFormRuntime.version=1.0.26
