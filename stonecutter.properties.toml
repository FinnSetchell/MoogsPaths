# ------------------------------------------------------------------ 26.3 (Java 25)
# 26.3 folded configured features into worldgen/feature, so path_gen's definition moves there
# (src/overlays/26.3) and the configured_feature copy stays out of the jar.
["26.3"]
mod.java = "25"
mod.pack_formats = '"min_format": [121, 0], "max_format": [121, 0]'
mod.legacy_data = "false"
mod.overlays = "26.2,26.3"
mod.resource_excludes = "data/*/worldgen/configured_feature/**"

[fabric."26.3"]
mod.mc_build = "26.3"
mod.mc_compat = ">=26.3 <26.4"
mod.fabric_loader_dep = ">=0.19.5"
mod.fabric_mixins = "false"
deps.fabric_loader = "0.19.5"
deps.fabric_api = "0.160.6+26.3"
deps.cloth_config = "26.3.158"
deps.modmenu = "21.0.0-beta.1"

