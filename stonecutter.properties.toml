# Per-node values. Mod metadata that never varies stays in gradle.properties.
# Tables are picked per node by `properties { tags(version, loader) }` in stonecutter.gradle.kts, so
# `deps.fabric_api` resolves to whatever the matching [fabric."<version>"] table declares.
#
# A node's version (the table name) is what `//? if` conditions compare against. mod.mc_build is the
# Minecraft version it compiles against. mod.mc_compat is the range the jar declares, in each loader's
# own syntax. mod.pack_formats is spliced into pack.mcmeta.
#
# mod.legacy_data rewrites the datapack into its pre-1.21 shape (buildSrc's legacy-data plugin).
# mod.overlays names the src/overlays/ folders whose files replace shared resources on that node.
# mod.fabric_mixins ships the Fabric mixin config; only 1.20 has a mixin.
# mod.resource_excludes drops shared resources a node must not ship (comma-separated patterns).
# mod.neo_icon_key is the neoforge.mods.toml key for the mod icon; NeoForge 26.3 renamed it.
# deps.cloth_config and deps.modmenu are only compiled against, for the optional config screen; the
# versions match Moog's Structure Lib's for the same Minecraft.

# Loom for the obfuscated versions, applied by dev.kikugie.loom-back-compat.
loomx.loom_version = "1.17-SNAPSHOT"
deps.neoforge_loader_range = "[4,)"

# ------------------------------------------------------------------ 1.20 (Java 17)
["1.20"]
mod.java = "17"
mod.pack_formats = '"pack_format": 15'
mod.legacy_data = "true"
mod.overlays = ""
mod.resource_excludes = ""

# Fabric API 0.83 has no dynamic registry API, so 1.20 registers through a mixin that uses
# MixinExtras, which Fabric Loader bundles from 0.15.
[fabric."1.20"]
mod.mc_build = "1.20"
mod.mc_compat = "1.20"
mod.fabric_loader_dep = ">=0.15"
mod.fabric_mixins = "true"
deps.fabric_loader = "0.16.9"
deps.fabric_api = "0.83.0+1.20"
deps.cloth_config = "11.0.99"
deps.modmenu = "7.2.2"

# Built by build.forge-legacy.gradle.kts: Forge before 1.20.5 needs a reobfuscated jar.
[forge."1.20"]
mod.mc_build = "1.20"
mod.mc_compat = "[1.20,1.20.1)"
deps.forge = "46.0.14"
deps.forge_loader_range = "[46,47)"
deps.forge_range = "[46.0.14,)"
deps.cloth_config = "11.0.99"
deps.cloth_config_loader = "forge"

