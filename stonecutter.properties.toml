mod.mc_compat = "[26.3, 26.4)"
mod.neo_icon_key = "iconFile"
# 26.3.0.31 replaced DataPackRegistryEvent.NewRegistry, so earlier 26.3 betas cannot load this jar.
deps.neoforge = "26.3.0.31-beta"
deps.neoforge_range = "[26.3.0.31-beta,)"
deps.cloth_config = "26.3.158"
