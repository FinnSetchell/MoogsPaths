pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'MoogsPaths'
include("common")
include("fabric")
// Forge subproject excluded for the 1.21.11 port: Forge 61 reworked the event-bus API
// (FMLJavaModLoadingContext.getModEventBus / MinecraftForge.EVENT_BUS.addListener removed),
// which the existing forge module relied on. Restoring Forge support is a separate piece
// of work — wire IEventBus through the @Mod constructor and rewrite the event listeners.
// include("forge")
include("neoforge")
