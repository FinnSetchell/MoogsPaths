pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'MoogsPaths'
include("common")
include("fabric")
// Forge subproject temporarily excluded for the 26.1 port: ForgeGradle 6.x does not yet support
// Gradle 9.x which is required for Java 25 / NeoForge 26.1. Re-include once ForgeGradle 7 ships,
// or drop the Forge target permanently in favour of NeoForge.
// include("forge")
include("neoforge")
